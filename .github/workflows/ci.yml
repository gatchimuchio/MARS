name: MARS experimental conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-archive-contract:
    name: Original-source provenance and archive contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify source identities and archive metadata (offline)
        run: python -m unittest discover -s tools/tests -v

  mars101-logical:
    name: MARS-101 logical experiment
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Full-system checks
        working-directory: experiments/mars101-logical
        run: python -m unittest discover -s tests -v
      - name: End-to-end demonstration
        working-directory: experiments/mars101-logical
        run: python mars101_lab.py demo

  mars1-design-decisions:
    name: MARS-1 constrained design alternatives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check identical booking results and physical timing model
        run: python -m unittest discover -s experiments/mars1-design-decisions/tests -v
      - name: Run counterfactual comparison
        run: python experiments/mars1-design-decisions/design_lab.py run --summary

